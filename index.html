<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>✧ Rock · Paper · Scissors ✧ | Nexus Bootcamp 5</title>
  <!--google fonts & font awesome 6 (free CSS icons), so here i used css icons instead of using emojis or copying icons from text -- just to make it modern looking -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
<!-- a simple favicon to make it look like a real modern website-->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%231a2a3a' stroke='%23ffd700' stroke-width='3'/%3E%3Ctext x='50' y='68' font-size='50' text-anchor='middle' fill='%23ffd700' font-weight='bold'%3E✊%3C/text%3E%3C/svg%3E">

</head>
<body> 

  <div class="game-container">
    <header class="game-header">
      <h1><i class="fas fa-hand-fist"></i> ROCK · PAPER · SCISSORS <i class="fas fa-hand-peace"></i></h1>
      <p class="sub">choose your weapon · battle the machine</p>
    </header>

    <!-- Round Mode Selection (5 or 7 rounds) -->
    <div class="mode-panel" id="modePanel">
      <span class="mode-label"><i class="fas fa-flag-checkered"></i> SELECT ROUNDS</span>
      <div class="mode-buttons">
        <!--just to make the players comfortable with the round or turn they wanna play-->
        <button class="mode-btn" data-rounds="5">⚡ 5 ROUNDS</button>
        <button class="mode-btn" data-rounds="7">🔥 7 ROUNDS</button>
      </div>
    </div>

    <!--main game arena it's gonna be hidden until mode selected -->
    <div class="game-arena" id="gameArena" style="display: none;">
      <div class="scoreboard">
        <div class="score-card player-card">
          <i class="fas fa-user-astronaut"></i><!--here fas fa - ..... something like this are just using the font awesome icons and adding the name at the end just to pick the icon they want-->
          <span class="score-label">YOU</span>
          <div class="score-value" id="playerScore">0</div>
        </div>
        <div class="round-tracker">
          <i class="fas fa-dice-d6"></i>
          <span>ROUND</span>
          <strong id="currentRound">1</strong> / <span id="maxRounds">5</span>
        </div>
        <div class="score-card comp-card">
          <i class="fas fa-robot"></i>
          <span class="score-label">COM</span>
          <div class="score-value" id="compScore">0</div>
        </div>
      </div>
      <!--here's the arena where we can see our score and the computer score-->
      <div class="battle-area">
        <div class="choice-display player-choice-area">
          <div class="choice-icon" id="playerChoiceIcon">
            <i class="fas fa-question-circle"></i>
          </div>
          <span class="role-tag">YOU</span>
        </div>
        <div class="vs-divider">
          <i class="fas fa-bolt"></i> VS <i class="fas fa-bolt"></i>
        </div>
        <div class="choice-display comp-choice-area">
          <div class="choice-icon" id="compChoiceIcon">
            <i class="fas fa-microchip"></i>
          </div>
          <span class="role-tag">COM</span>
        </div>
      </div>

      <!--here's -- result message + animation wrapper -->
      <div class="result-animation-area" id="resultAnimArea">
        <div class="result-message" id="resultMessage">✨ pick a move ✨</div>
      </div>

      <!--action buttons: Rock, Paper, Scissors with fontAwesome icons -->
      <div class="action-buttons">
        <button class="game-btn rock" data-move="rock">
          <i class="fas fa-hand-back-fist"></i>
          <span>ROCK</span>
        </button>
        <button class="game-btn paper" data-move="paper">
          <i class="fas fa-hand-peace"></i>
          <span>PAPER</span>
        </button>
        <button class="game-btn scissors" data-move="scissors">
          <i class="fas fa-hand-scissors"></i>
          <span>SCISSORS</span>
        </button>
      </div>

      <!--restart game button-->
      <div class="restart-container">
        <button class="restart-btn" id="restartGameBtn"><i class="fas fa-undo-alt"></i> RESTART GAME</button>
      </div>
    </div>

    <!--final winner overlay / modal style (simple dynamic)-->
    <div id="winnerOverlay" class="winner-overlay" style="display: none;">
      <div class="winner-card">
        <i class="fas fa-crown"></i>
        <h2 id="winnerText">🏆 WINNER 🏆</h2>
        <button id="closeWinnerBtn" class="winner-restart">PLAY AGAIN <i class="fas fa-play"></i></button>
      </div>
    </div>
  </div>

  <script src="js/game.js"></script>
</body>
</html>
